services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/strategies.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://web,http://localhost
    volumes:
      - api_data:/app/data

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  api_data:
